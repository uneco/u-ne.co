  <head>

    <style>
      /* ---- uneco design system: tokens + reset + base ---------------------- */
      :root {
        color-scheme: light;

        --bg: #e4e5e2;
        --panel: #ececea;
        --card: #f3f3f1;

        --line: #c7c8c4;
        --line-soft: #d8d9d5;

        --ink: #1c1d1b;
        --ink-dim: #5c5d57;
        --ink-faint: #63645e;

        --accent: #f97400;
        --accent-ink: #9c4900;
        --accent-soft: rgba(249, 116, 0, 0.09);
        --on-accent: #1c1d1b;

        --warn: #77590c;
        --error: #b3261e;
        --ok: #276b43;

        --font-ui: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;

        --text-xs: 11px;   --lh-xs: 16px;
        --text-sm: 12px;   --lh-sm: 16px;
        --text-base: 14px; --lh-base: 24px;
        --text-lg: 16px;   --lh-lg: 24px;

        --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px;
        --row-height: 32px;
        --rig-width: 264px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }

      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-ui);
        font-size: var(--text-sm);
        line-height: var(--lh-sm);
      }
      button { font-family: var(--font-ui); }
      .icon { display: inline-block; vertical-align: middle; flex: none; }
      button .icon { pointer-events: none; }

      .micro {
        font-size: var(--text-xs); line-height: var(--lh-xs);
        text-transform: uppercase; letter-spacing: 0.14em;
        color: var(--ink-dim); font-weight: 600;
      }
      .num {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      :focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

      /* ---- layout ---------------------------------------------------------- */
      .app { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

      .head {
        height: 40px; flex: none; display: flex; align-items: center; gap: var(--sp-2);
        background: var(--panel); border-bottom: 1px solid var(--line);
        padding-right: var(--sp-3);
      }
      .head-band { width: 6px; align-self: stretch; background: var(--accent); flex: none; }
      .brand-mark { width: 14px; height: 14px; background: var(--accent); flex: none; margin-left: var(--sp-2); }
      .brand {
        font-size: var(--text-xs); line-height: var(--lh-xs); font-weight: 700;
        letter-spacing: 0.22em; text-transform: uppercase;
      }
      .head-mode { color: var(--ink-dim); font-size: var(--text-sm); }
      .head-spacer { flex: 1; }
      .head-hint { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-faint); }

      .body { flex: 1; min-height: 0; display: flex; }

      .rig {
        width: var(--rig-width); flex: none; min-height: 0;
        background: var(--panel); border-right: 1px solid var(--line);
        display: flex; flex-direction: column;
      }
      .rig-scroll { flex: 1; min-height: 0; overflow-y: auto; }

      .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .view { flex: 1; min-height: 0; position: relative; background: var(--bg); }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }

      /* ---- sidebar sections ------------------------------------------------ */
      .sec { border-bottom: 1px solid var(--line); padding: var(--sp-2); }
      .sec-head {
        height: 16px; display: flex; align-items: center; justify-content: space-between;
        margin-bottom: var(--sp-1);
      }
      .cluster { display: flex; flex-wrap: wrap; gap: var(--sp-1); }

      .btn {
        height: 24px; padding: 0 var(--sp-2);
        display: inline-flex; align-items: center; gap: var(--sp-1);
        background: var(--card); border: 1px solid var(--line);
        color: var(--ink); font-size: var(--text-xs); font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer;
      }
      .btn:hover { border-color: var(--ink-dim); }
      .btn.wide { flex: 1; justify-content: center; }

      /* ---- three kinds of control, and they must not look alike -----------
         Picking one preset out of five, switching the clock on and off, and
         stepping the stroke once are three different acts. Told apart by SHAPE,
         not by colour: a joined bar, a state square, an arrow. */

      /* Multi-choice. One continuous strip with hairline dividers and no gaps,
         so the set reads as a set and the choice reads as exclusive. This is the
         only family that carries the orange, because it is the only one that
         answers "where am I". */
      .seg {
        display: flex; flex-wrap: wrap; gap: 1px;
        border: 1px solid var(--line); background: var(--line-soft);
      }
      /* The 1px gap over the strip's own background IS the divider, which is what
         lets the bar wrap onto a second row without the seam breaking or a stub of
         empty track showing: the items in each row stretch to fill it. */
      .seg .btn {
        flex: 1 1 auto; min-width: 64px; justify-content: center;
        border: none; background: var(--card);
      }
      .seg .btn:hover { background: var(--panel); }
      .seg .btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

      /* Toggle. The label never changes — the square does, using the same
         vocabulary as the status marks: filled is on, hollow is off. A control
         whose text rewrites itself cannot be read at a glance, because the label
         is the state and the state is what you are looking for. */
      .tgl .sq {
        width: 7px; height: 7px; flex: none;
        border: 1px solid var(--ink-faint); background: transparent;
      }
      .tgl[aria-pressed="true"] .sq { background: var(--ink); border-color: var(--ink); }

      /* Action. Happens once and holds nothing, so it has no state to show and
         carries an arrow instead. Sits on the recessed surface and inverts while
         held, which is the only press feedback in here. */
      .act { background: var(--panel); }
      .act:active { background: var(--ink); border-color: var(--ink); color: var(--bg); }

      /* ---- parameter rows (32px) ------------------------------------------ */
      .group {
        height: 24px; display: flex; align-items: center; justify-content: space-between;
        padding: 0 var(--sp-2);
        background: var(--card);
        border-top: 1px solid var(--line); border-bottom: 1px solid var(--line-soft);
      }
      .group:first-child { border-top: none; }
      .group-note { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-faint); }

      .knob {
        height: var(--row-height); padding: 0 var(--sp-2);
        border-left: 2px solid transparent;
        display: grid; grid-template-rows: 16px 16px;
      }
      .knob:hover { background: var(--card); border-left-color: var(--line); }
      .knob:focus-within { background: var(--card); border-left-color: var(--accent); }
      .knob-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
      .knob-val { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink); }

      input[type="range"] {
        -webkit-appearance: none; appearance: none;
        display: block; width: 100%; height: 16px;
        background: transparent; cursor: ew-resize;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 4px; border: 1px solid var(--line);
        background: linear-gradient(to right, var(--ink-dim) var(--fill, 0%), var(--bg) var(--fill, 0%));
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 7px; height: 14px; margin-top: -6px;
        background: var(--ink); border: none; border-radius: 0;
      }
      input[type="range"]::-moz-range-track {
        height: 4px; border: 1px solid var(--line);
        background: linear-gradient(to right, var(--ink-dim) var(--fill, 0%), var(--bg) var(--fill, 0%));
      }
      input[type="range"]::-moz-range-thumb {
        width: 7px; height: 14px; background: var(--ink); border: none; border-radius: 0;
      }

      /* ---- readout: the instrument's own dial ------------------------------ */
      .readout {
        height: 40px; flex: none; display: flex; align-items: center; gap: var(--sp-3);
        padding: 0 var(--sp-3);
        background: var(--panel); border-top: 1px solid var(--line);
        font-size: var(--text-xs); line-height: var(--lh-xs);
      }
      .state { display: flex; align-items: center; gap: var(--sp-2); flex: none; }
      .mark { width: 7px; height: 7px; flex: none; border: 1px solid var(--ink-faint); background: transparent; }
      .mark.beating { background: var(--accent); border-color: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @media (prefers-reduced-motion: reduce) { .mark.beating { animation: none; } }

      .gauge { flex: 1; min-width: 120px; display: flex; align-items: center; gap: var(--sp-2); }
      .gauge-limit { color: var(--ink-faint); flex: none; }
      .gauge-track {
        position: relative; flex: 1; min-width: 80px; height: 12px;
        border: 1px solid var(--line); background: var(--bg);
      }
      /* Horizontal: where the stroke is between its two limits. Vertical: zero. */
      .gauge-zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
      .gauge-hand { position: absolute; top: -2px; width: 3px; height: 14px; background: var(--ink); margin-left: -1px; }
      .gauge-read { flex: none; width: 48px; text-align: right; color: var(--ink); }

      .meta { display: flex; gap: var(--sp-3); flex: none; color: var(--ink-faint); }

      /* ---- failure --------------------------------------------------------- */
      #err {
        position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        background: var(--bg); padding: var(--sp-6);
      }
      #err.on { display: flex; }
      .err-box { max-width: 52ch; border: 1px solid var(--error); border-left: 3px solid var(--error); background: var(--panel); }
      .err-head {
        height: 24px; display: flex; align-items: center; padding: 0 var(--sp-2);
        background: var(--card); border-bottom: 1px solid var(--line-soft);
        font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.1em; color: var(--error);
      }
      .err-body { padding: var(--sp-2); font-size: var(--text-sm); line-height: var(--lh-sm); }
      .err-detail { margin-top: var(--sp-2); font-family: var(--font-mono); color: var(--ink-dim); white-space: pre-wrap; }

      /* ---- narrow ---------------------------------------------------------- */
      @media (max-width: 760px) {
        .body { flex-direction: column-reverse; }
        .rig { width: 100%; max-height: 46%; border-right: none; border-top: 1px solid var(--line); }
        .readout {
          height: 40px;
          display: grid;
          grid-template-columns: auto minmax(0, 1fr);
          grid-template-rows: 16px 16px;
          column-gap: var(--sp-2);
          row-gap: 0;
          padding: var(--sp-1) var(--sp-2);
        }
        .state { grid-column: 1; grid-row: 1; }
        .gauge { grid-column: 1 / -1; grid-row: 2; width: 100%; min-width: 0; }
        .gauge-track { min-width: 0; }
        .meta {
          grid-column: 2;
          grid-row: 1;
          min-width: 0;
          overflow: hidden;
          justify-self: end;
          white-space: nowrap;
          text-overflow: ellipsis;
        }
      }
    </style>
    <script type="module" crossorigin src="/butterfly/assets/index-CL-mIKpV.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="head">
        <span class="head-band"></span>
        <span class="brand-mark"></span>
        <span class="brand">Wingbeat</span>
        <span class="head-mode" id="head-mode"></span>
        <span class="head-spacer"></span>
        <span class="head-hint">Drag to orbit, wheel to zoom</span>
      </header>

      <div class="body">
        <aside class="rig">
          <div class="rig-scroll">
            <section class="sec">
              <div class="sec-head"><span class="micro">Flight</span></div>
              <div class="seg" id="presets"></div>
            </section>

            <section class="sec">
              <div class="sec-head">
                <span class="micro">Playback</span>
                <span class="num knob-val" id="speed-out"></span>
              </div>
              <div class="cluster" style="margin-bottom: var(--sp-1)">
                <button class="btn tgl wide" id="pause" aria-pressed="true"><span class="sq"></span>Run</button>
                <button class="btn tgl wide" id="spin" aria-pressed="true"><span class="sq"></span>Orbit</button>
              </div>
              <div class="cluster" style="margin-bottom: var(--sp-1)">
                <button class="btn act wide" id="step"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M12 4v8"/><path d="M4 8h6"/><path d="M7.5 5 10.5 8 7.5 11"/></svg>Step</button>
                <button class="btn act wide" id="rewind"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M4 4v8"/><path d="M12 8H6"/><path d="M8.5 5 5.5 8 8.5 11"/></svg>Rewind</button>
              </div>
              <input id="speed" type="range" min="0.02" max="1" step="0.01" aria-label="Playback speed" />
            </section>

            <section class="sec">
              <div class="sec-head"><span class="micro">Wing surface</span></div>
              <div class="seg" id="patterns"></div>
            </section>

            <div id="knobs"></div>
          </div>
        </aside>

        <main class="stage">
          <div class="view">
            <canvas id="view"></canvas>
            <div id="err">
              <div class="err-box">
                <div class="err-head">WebGPU unavailable</div>
                <div class="err-body">
                  This simulation requires WebGPU. Check that your browser supports WebGPU
                  and that GPU acceleration is enabled.
                  <div class="err-detail" id="err-detail"></div>
                </div>
              </div>
            </div>
          </div>

          <footer class="readout">
            <span class="state">
              <span class="mark" id="mark"></span>
              <span class="micro" id="state-text">Beating</span>
            </span>
            <span class="gauge">
              <span class="micro">Stroke</span>
              <span class="num gauge-limit" id="gauge-lo"></span>
              <span class="gauge-track">
                <span class="gauge-zero" id="gauge-zero"></span>
                <span class="gauge-hand" id="gauge-hand"></span>
              </span>
              <span class="num gauge-limit" id="gauge-hi"></span>
              <span class="num gauge-read" id="gauge-read"></span>
            </span>
            <span class="meta num" id="meta"></span>
          </footer>
        </main>
      </div>
    </div>
  </body>
